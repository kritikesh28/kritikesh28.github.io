name: Tell search engines about new pages (IndexNow)

# After each successful publish, send the list of pages in the sitemap to IndexNow.
# Bing (which also feeds ChatGPT search and Copilot), Yandex, Seznam and Naver use it to re-read pages quickly.
# Google does not use IndexNow; for Google, the sitemap in Search Console does the job.
# The key below is public on purpose: it only proves this site owns the list. Its file is public/a1a8670a13934983a9f2272ac3cd12f2.txt

on:
  workflow_run:
    workflows: ['Deploy site to GitHub Pages']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      HOST: curioussparoows.com
      KEY: a1a8670a13934983a9f2272ac3cd12f2
    steps:
      - name: Send sitemap pages to IndexNow
        run: |
          sleep 60
          curl -fsSL "https://$HOST/sitemap-index.xml" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' > maps.txt
          : > urls.txt
          while read -r m; do curl -fsSL "$m" | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g' >> urls.txt; done < maps.txt
          echo "Pages found: $(wc -l < urls.txt)"
          head -n 10000 urls.txt | jq -R . | jq -s --arg host "$HOST" --arg key "$KEY" \
            '{host: $host, key: $key, keyLocation: ("https://" + $host + "/" + $key + ".txt"), urlList: .}' > body.json
          code=$(curl -s -o resp.txt -w '%{http_code}' -H 'Content-Type: application/json; charset=utf-8' --data @body.json https://api.indexnow.org/indexnow)
          echo "IndexNow answered $code"; cat resp.txt
          case "$code" in 200|202) ;; *) exit 1 ;; esac
